# What maelys-http declares to the socle's release mechanism.

[package]
# Every target of the socle verifies — linux-x86_64, linux-arm64 and
# macos-arm64 each run scripts/verify-release.sh at the tag — and two package,
# each under names of its own, since the socle refuses two targets that
# publish one name with different bytes.
# linux-x86_64 writes the source archive. `git archive` writes the same tar
# on every machine, but gzip does not, so the source is packaged once.
# macos-arm64 writes the binary archive maelys-http-VERSION-macos-arm64.tar.gz:
# the three static archives, the headers and the pkg-config files, on the
# model of maelys-system's. The Linux targets publish no binary archive: their
# Mbed TLS is built from dependencies/mbedtls.pin for the gates only, and a
# provider archive compiled against it would assume a configuration no
# consumer installs.
linux-x86_64
macos-arm64

[manifest]
# Beyond the socle's *.tar.gz: the canonical uncompressed tar the digests are
# taken over, and the SBOM that describes the compressed one. What is not
# named here is attested and never published.
*.tar
*.spdx.json

[sbom]
# One document per packaging target, written after the archive it describes,
# naming that file and recording its digest, which is what the release
# re-reads before attesting: maelys-http-VERSION.spdx.json describes the
# source archive, maelys-http-VERSION-macos-arm64.spdx.json the binary one.
*.spdx.json

[gate]
# A human approves the publication. In a fleet of one maintainer the approver
# and the tagger are the same person, so this is a pause rather than a
# control — and a pause is what was missing the day a tag was pushed here
# before its verdict had been read.
reviewer

[cut]
# VERSION is materialised twice: the file, and the three macros of
# include/maelys/http.h a consumer compiles against. `cut` runs this between
# writing VERSION and the bump commit, so the two never travel apart and the
# release pull request never fails its own `make check-version`.
after-version sh scripts/bump-version.sh

[dependencies]
# The pinned checkouts live apart from this repository, under
# $MAELYS_DEPENDENCIES_DIR, and never beside it. Beside it is where the
# working copy of somebody who also develops Maelys System sits, and
# ../maelys-system could not be told from it: this repository read whatever
# was there and its own checks were the only thing that noticed.
apart

[commit]
# The signed tag says who published; this says what was published. The commit
# carries its own GitHub-verified signature and is an ancestor of the default
# branch, so a tag cannot publish a commit that never landed on a branch whose
# rules apply. Which keys may sign the tag at all is the socle's own list,
# share/allowed-signers at the commit this repository pins, since v0.62.0.
signed-on-default-branch
