name: CI

# Owned by this repository. The check job is the socle's shared product CI,
# which reads dependencies/*.pin and dependencies/packages itself and returns
# the conventions verdict; the jobs beside it are what this product needs on
# top: the second compiler on each Linux architecture, and the pinned Mbed TLS
# the distribution does not ship.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@421fa11587ed69f93c252275f7fff64e45b8e8c1 # v0.57.1
    with:
      product: maelys-http
      check_command: make check install-check
      sanitizer_command: |
        make sanitizers
        make tsan
        make fuzz
      fuzz_command: make fuzz-smoke

  # The shared check builds with the host's default compiler, gcc on Linux and
  # clang on macOS. This covers the other one on both Linux architectures, so
  # -Werror is answered by both toolchains.
  clang:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Under $RUNNER_TEMP and never beside the checkout, which is what
      # MAELYS_DEPENDENCIES_DIR means. Named one by one rather than through
      # scripts/checkout-dependencies.sh, which clones every pin: this job
      # links against Maelys System and never touches Mbed TLS, and the
      # organisation pays ten minutes for one on macOS.
      - name: Pinned dependencies
        run: |
          sh scripts/checkout-dependency.sh maelys-system "$RUNNER_TEMP/dependencies/maelys-system"
          echo "MAELYS_DEPENDENCIES_DIR=$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install packages
        run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install -y clang pkg-config cmake
      - name: Build and test
        run: make check install-check CC=clang CXX=clang++
      - name: Architecture
        run: uname -m

  mbedtls:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned dependencies
        run: |
          sh scripts/checkout-dependency.sh maelys-system "$RUNNER_TEMP/dependencies/maelys-system"
          echo "MAELYS_DEPENDENCIES_DIR=$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      # The Linux distribution ships Mbed TLS below the floor that
      # providers/mbedtls_version_policy.h enforces, so the pinned upstream
      # commit is built from source. dependencies/mbedtls.pin names it, the
      # repository it lives in and the submodule its build needs. macOS takes
      # brew's, which is above the floor, and clones none of this.
      - name: Pinned Mbed TLS (Linux)
        if: runner.os == 'Linux'
        run: |
          sh scripts/checkout-dependency.sh mbedtls "$RUNNER_TEMP/dependencies/mbedtls"
          # The same script the release runs, so the two cannot drift.
          echo "PKG_CONFIG_PATH=$(sh scripts/build-pinned-mbedtls.sh --print)" >>"$GITHUB_ENV"
      - name: Install Mbed TLS (macOS)
        if: runner.os == 'macOS'
        run: brew install mbedtls
      - name: Physical TLS lifecycle
        run: make clean tls-integration REQUIRE_MBEDTLS=1
