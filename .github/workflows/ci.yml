name: CI

# Owned by this repository. The check job is the socle's shared product CI,
# which reads dependencies/*.pin and dependencies/packages itself and returns
# the conventions verdict; the jobs beside it are what this product needs on
# top: the second compiler on each Linux architecture, and the pinned Mbed TLS
# the distribution does not ship.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@d71cb5c0ccc95e0fd253bbe4da0c612806a4a824 # v0.24.0
    with:
      product: maelys-http
      check_command: make check install-check
      sanitizer_command: |
        make sanitizers
        make tsan
        make fuzz
      fuzz_command: make fuzz-smoke

  # The shared check builds with the host's default compiler, gcc on Linux and
  # clang on macOS. This covers the other one on both Linux architectures, so
  # -Werror is answered by both toolchains.
  clang:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependency.sh maelys-system
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config cmake
      - name: Build and test
        run: make check install-check CC=clang CXX=clang++
      - name: Architecture
        run: uname -m

  mbedtls:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned dependency checkouts
        run: sh scripts/checkout-dependency.sh maelys-system
      # The Linux distribution ships Mbed TLS below the floor that
      # providers/mbedtls_version_policy.h enforces, so the pinned upstream
      # commit is built from source. dependencies/mbedtls.pin names it, the
      # repository it lives in and the submodule its build needs.
      - name: Pinned Mbed TLS checkout (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/checkout-dependency.sh mbedtls
      - name: Build pinned Mbed TLS (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S ../mbedtls -B ../mbedtls-build \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/mbedtls-prefix"
          cmake --build ../mbedtls-build --parallel
          cmake --install ../mbedtls-build
          test -f "$GITHUB_WORKSPACE/mbedtls-prefix/lib/pkgconfig/mbedtls.pc"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/mbedtls-prefix/lib/pkgconfig" \
            >>"$GITHUB_ENV"
      - name: Install Mbed TLS (macOS)
        if: runner.os == 'macOS'
        run: brew install mbedtls
      - name: Physical TLS lifecycle
        run: make clean tls-integration REQUIRE_MBEDTLS=1
