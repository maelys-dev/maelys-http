name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: maelys-http-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authenticity:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify signed tag, signed commit and protected lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-allowed-signers" \
            verify-tag "$GITHUB_REF_NAME"
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          commit_verification=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/commits/$tag_commit" \
            --jq '"\(.verification.verified) \(.verification.reason)"')
          test "$commit_verification" = "true valid"

  verify:
    needs: authenticity
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            release_artifact: true
          - runner: ubuntu-26.04-arm
            release_artifact: false
          - runner: macos-15
            install: brew install mbedtls
            release_artifact: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Pinned maelys-system checkout
        run: sh scripts/checkout-dependency.sh maelys-system maelys-system
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os == 'Linux'
        with:
          repository: Mbed-TLS/mbedtls
          ref: 068ff080b369adfac81509f9b57b2afabaf82dc5 # v3.6.7
          path: mbedtls
          submodules: recursive
      - name: Build pinned Mbed TLS 3.6.7 (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S mbedtls -B mbedtls-build \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/mbedtls-prefix"
          cmake --build mbedtls-build --parallel
          cmake --install mbedtls-build
          test -f "$GITHUB_WORKSPACE/mbedtls-prefix/lib/pkgconfig/mbedtls.pc"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/mbedtls-prefix/lib/pkgconfig" \
            >>"$GITHUB_ENV"
      - run: ${{ matrix.install }}
        if: runner.os == 'macOS'
      - run: make -C maelys-system clean check CC=clang CXX=clang++
      - name: Verify source, install and physical TLS lifecycle
        run: |
          make clean check install-check \
            CC=clang CXX=clang++ SYSTEM_DIR=maelys-system
          make tls-integration REQUIRE_MBEDTLS=1 \
            CC=clang CXX=clang++ SYSTEM_DIR=maelys-system
      - name: Build the release bytes and SPDX SBOM once
        if: matrix.release_artifact
        run: make package-archive-check package-homebrew SYSTEM_DIR=maelys-system
      - name: Preserve the tested release bytes
        if: matrix.release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/maelys-http-*.tar
            dist/maelys-http-*.tar.sha256
            dist/maelys-http-*.tar.gz
            dist/maelys-http-*.tar.gz.sha256
            dist/maelys-http-*.spdx.json
            dist/SHA256SUMS
            dist/homebrew/maelys-http.rb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore the already-tested release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify promoted bytes and locate the SBOM
        id: release-files
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          (cd dist && sha256sum -c SHA256SUMS)
          archive=$(find dist -maxdepth 1 -name 'maelys-http-*.tar.gz' -type f)
          sbom=$(find dist -maxdepth 1 -name 'maelys-http-*.spdx.json' -type f)
          test -n "$archive"
          test -n "$sbom"
          test "$(printf '%s\n' "$archive" | wc -l)" = 1
          test "$(printf '%s\n' "$sbom" | wc -l)" = 1
          printf 'archive=%s\nsbom=%s\n' "$archive" "$sbom" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/maelys-http-*.tar
            dist/maelys-http-*.tar.gz
      - name: Preserve the offline provenance bundle
        run: |
          version=$(cat VERSION)
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "dist/maelys-http-$version.provenance.intoto.jsonl"
      - name: Attest the SPDX SBOM against the compressed archive
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}
          sbom-path: ${{ steps.release-files.outputs.sbom }}
      - name: Preserve the offline SBOM bundle
        run: |
          version=$(cat VERSION)
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "dist/maelys-http-$version.sbom.intoto.jsonl"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/maelys-http-*.tar dist/maelys-http-*.tar.sha256 \
            dist/maelys-http-*.tar.gz dist/maelys-http-*.tar.gz.sha256 \
            dist/maelys-http-*.spdx.json dist/maelys-http-*.intoto.jsonl \
            dist/SHA256SUMS dist/homebrew/maelys-http.rb \
            --verify-tag --generate-notes --title "Maelys HTTP $GITHUB_REF_NAME"
