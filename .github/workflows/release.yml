name: release

# Managed by maelys-release v0.42.0 (0.42.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@a96cf015064b98de604ffce62fcf4cf351b9f754 # v0.42.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-http
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependency.sh maelys-system
        sh scripts/checkout-dependency.sh mbedtls
      verify_command: bash scripts/verify-release.sh TARGET
      linux_packages: build-essential dpkg-dev file rpm pkg-config cmake
      macos_packages: pkg-config mbedtls
      targets: '[{"target": "linux-x86_64"}]'
      manifest_patterns: '*.tar.gz *.deb *.rpm *.tar *.spdx.json'
      sbom_pattern: '*.spdx.json'

  tap-libmaelys-http:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@a96cf015064b98de604ffce62fcf4cf351b9f754 # v0.42.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-http
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT libmaelys-http
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
