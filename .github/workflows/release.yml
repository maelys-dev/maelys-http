name: release

# Managed by maelys-release v0.57.0 (0.57.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@4c3ebc3269b4689011bbda4d02a77f8f4b9163b0 # v0.57.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-http
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      verify_command: bash scripts/verify-release.sh TARGET
      linux_packages: build-essential dpkg-dev file rpm pkg-config cmake python3 openssl
      macos_packages: pkg-config mbedtls
      targets: '[{"target": "linux-x86_64"}, {"target": "linux-arm64", "package": false}, {"target": "macos-arm64", "package": false}]'
      manifest_patterns: '*.tar.gz *.deb *.rpm *.tar *.spdx.json'
      sbom_pattern: '*.spdx.json'
      commit_verification: signed-on-default-branch

  tap-libmaelys-http:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@4c3ebc3269b4689011bbda4d02a77f8f4b9163b0 # v0.57.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: libmaelys-http
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT libmaelys-http
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
